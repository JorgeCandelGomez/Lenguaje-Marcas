<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Validación de Formulario</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .campo { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
    <script src="fichero.js"></script>
</head>
<body>

    <h2>Formulario de Registro</h2>

    <form id="form2" name="form2">
        
        <div class="campo">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" >
        </div>

        <div class="campo">
            <label for="edad">Edad</label>
            <input type="number" id="edad" name="edad">
        </div>

        <div class="campo">
            <label for="nacimiento">Año de nacimiento</label>
            <input type="number" id="nacimiento" name="nacimiento">
        </div>

        <div class="campo">
            <label for="provincia">Seleccione provincia</label>
            <select id="provincia" name="provincia" >
                <option value="">-Seleccione una provincia-</option>
                <option value="Alicante">Alicante</option>
                <option value="Valencia">Valencia</option>
                <option value="Castellón">Castellón</option>
            </select>
        </div>

        <input id="botonEnviar" type="submit" value="Enviar">
    </form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="ficheroPrueba.js"></script>
</head>
<body>
    <form id="form1">
        <label for="login">Login</label>
        <input type="text" id="login" name="login" required><br><br>

        <label for="nhijos">Número de hijos</label>
        <input type="number" id="nhijos" name="nhijos"><br><br>

        
        <input type="checkbox" id="info" name="info">
        <label for="info">Deseo recibir información por e-mail</label>
        <br><br>

        <label>Elige tu horario</label>

        
        <input type="radio" id="mañana" name="horario" value="mañana" >
        <label for="mañana"> Mañana</label>

        <input type="radio" id="tarde" name="horario" value="tarde">
        <label for="tarde"> Tarde</label>

        <input type="radio" id="noche" name="horario" value="noche">
        <label for="noche"> Noche</label>
        <br><br>

        <label for="operador">Operador</label><br>
        <select id="operador">
            <option selected>Seleccione operador</option>
            <option value="Movil1">Movil1</option>
            <option value="Taronje">Taronje</option>
            <option value="Hablafone">Hablafone</option>
            <option value="Roigo">Roigo</option>
        </select>
        <br><br>
        <input type="button" id="botonEnviar" value="Enviar">
    </form>
    <br><br>
</body>
</html>

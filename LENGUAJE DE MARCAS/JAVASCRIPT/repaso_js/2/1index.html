<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function sumar(){
            let n1=Number(prompt("Número 1"));
            let n2=Number(prompt("Numero 2"));
            alert(n1+n2);
        }

        function restar(){
            let n1=Number(prompt("Número 1"));
            let n2=Number(prompt("Numero 2"));
            alert(n1-n2);
        }

        function multiplicar(){let n1=Number(prompt("Número 1"));
            let n2=Number(prompt("Numero 2"));
            alert(n1*n2);}

        function dividir(){
            let n1=Number(prompt("Número 1"));
            let n2=Number(prompt("Numero 2"));
            alert(n1/n2);
        }
    </script>
</head>
<body>
    <p onclick="sumar()">Suma</p>
    <p onclick="restar()">Resta</p>
    <p onclick="multiplicar()">Multiplicación</p>
    <p onclick="dividir()">División</p>
</body>
</html>

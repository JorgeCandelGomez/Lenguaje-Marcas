<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Drag & Drop</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        
        .contenedor { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 30px; 
            min-height: 100px;
            padding: 10px;
            border: 1px solid #eee;
        }

        /* Los logos que se arrastran */
        .logo {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: move;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Las casillas donde se suelta */
        .casilla {
            width: 120px;
            height: 120px;
            border: 3px dashed #bdc3c7;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 0.9em;
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Arrastra los logotipos a su casilla</h2>

    <div class="contenedor" id="origen">
        <div id="chrome" class="logo" draggable="true">CHROME</div>
        <div id="firefox" class="logo" draggable="true">FIREFOX</div>
        <div id="safari" class="logo" draggable="true">SAFARI</div>
    </div>

    <div class="contenedor">
        <div id="dest-chrome" class="casilla">Destino Chrome</div>
        <div id="dest-firefox" class="casilla">Destino Firefox</div>
        <div id="dest-safari" class="casilla">Destino Safari</div>
    </div>

    <button id="btnComprobar">Comprobar</button>

    <script src="5fichero.js"></script>

</body>
</html>

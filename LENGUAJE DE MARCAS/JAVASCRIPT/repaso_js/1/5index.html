<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let n1=Number(prompt("Numero 1"));
        let n2=Number(prompt("Numero 2"));

        if(n1<n2)
            for(var i=n1;i<=n2;i++)
                console.log(i)
        else if(n1>n2)
            for(var i=n1;i>=n2;i--)
                console.log(i)
        else
            alert("Los números son iguales")        
    </script>
</head>

</html>

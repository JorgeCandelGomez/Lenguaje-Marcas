<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Validación Avanzada</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .campo { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        
        /* Estilo para los inputs con error */
        .error-input {
            background-color: #ffcccc !important; /* Rojo claro */
        }

        input {
            padding: 8px;
            width: 250px;
            border: 1px solid #ccc;
            transition: background-color 0.3s ease;
        }

        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
    <script src="3fichero.js"></script>
</head>
<body>

    <h2>Registro de Usuario</h2>

    <form id="form3" name="form3" novalidate> 
        <div class="campo">
            <label for="login">Login (Obligatorio)</label>
            <input type="text" id="login" name="login" required>
        </div>

        <div class="campo">
            <label for="pass1">Password (mín. 8 caracteres, letras y números)</label>
            <input type="password" id="pass1" name="pass1" required>
        </div>

        <div class="campo">
            <label for="pass2">Repetir Password</label>
            <input type="password" id="pass2" name="pass2" required>
        </div>

        <div class="campo">
            <label for="email">Email (Obligatorio)</label>
            <input type="email" id="email" name="email" required>
        </div>

        <input id="botonEnviar"type="submit" value="Enviar">
    </form>

    
</body>
</html>

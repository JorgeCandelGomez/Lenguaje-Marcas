<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let nota=Number(prompt("Introduce la nota del exámen: "));

        if(nota >=0 && nota<5)
            alert("Suspendido");
        else if(nota>=5 && nota <6)
            alert("Suficente");
        else if(nota>=6 && nota<7)
            alert("Bien");
        else if(nota>=7 && nota <9)
            alert("Notable");
        else if (nota>=9 && nota<=10)
            alert("Sobresaliente");
    </script>
</head>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Autor">
        <meta name="description" content="140-160 palabras">
        <title>Tabla básica</title>
        <link rel="stylesheet" href="estilos.css">
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th colspan="4">Nombre de la tienda</th>
                </tr>
                <tr>
                    <th>Zona</th>
                    <th>Producto 1 (precio)</th>
                    <th>Producto 2 (precio)</th>
                    <th>TOTAL por Zona</th>
                </tr>
                
            </thead>
            <tbody>
                <tr>
                    <th>Norte</th>
                    <td>10€</td>
                    <td>15€</td>
                    <td>25€</td>
                </tr>
            
                <tr>
                    <th>Sur</th>
                    <td>8€</td>
                    <td>12€</td>
                    <td>20€</td>
                </tr>

               
            </tbody>
            <tfoot>
                 <tr>
                    <th>Totales</th>
                    <td>18€</td>
                    <td>27€</td>
                    <td>45€</td>
                </tr>
            </tfoot>

        </table>
    </body>
</html>

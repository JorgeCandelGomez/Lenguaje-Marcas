<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tabla y Multimedia</title>
        <link rel="stylesheet" href="estilos.css">
        
    </head>
    <body>
        <div class="tabla-responsive">
             <figure>
                <figcaption>Tabla de lo que sea.</figcaption>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido 1</th>
                            <th>Apellido 2</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Jorge</td>
                            <td>Picapiedra</td>
                            <td>Marmol</td>
                        </tr>

                        <tr>
                            <td>Carla</td>
                            <td>Marmol</td>
                            <td>Picapiedra</td>
                        </tr>

                        <tr>
                            <td>Jorge</td>
                            <td>Picapiedra</td>
                            <td>Marmol</td>
                        </tr>

                        <tr>
                            <td>Jorge</td>
                            <td>Picapiedra</td>
                            <td>Marmol</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3">Pie de tabla</td>
                        </tr>
                    </tfoot>

                </table>

            </figure>

        </div>
       
        <figure>
            <figcaption>Imagen de lo que sea </figcaption>
            <picture>
                <source media="(max-width:699px)" srcset="img/mobile.jpg">     
                
                <img src="img/desktop.jpg" alt="texto alternativo" class="imagen-adaptativa">
                
            </picture>

        </figure>
        
        
    </body>
</html>
